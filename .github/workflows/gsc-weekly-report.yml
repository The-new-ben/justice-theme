name: GSC Weekly Report

on:
  workflow_dispatch:
  schedule:
    - cron: "12 5 * * 1"

jobs:
  gsc-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade requests google-auth
      - name: Generate GSC reports
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
        run: python tools/gsc_weekly_report.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: gsc-weekly-report
          path: |
            project-control/gsc-opportunities.csv
            project-control/gsc-low-ctr.csv
            project-control/gsc-position-5-20.csv
            project-control/gsc-cannibalization.csv
